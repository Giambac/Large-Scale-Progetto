<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conversational Clustering Study</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0; padding: 0;
      background: #f5f5f5; color: #222;
      height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #1a1a2e; color: #eee;
      padding: 10px 20px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    #session-display { font-size: 0.8rem; opacity: 0.75; }

    /* Three-column layout */
    .study-layout {
      display: grid;
      grid-template-columns: 300px 1fr 280px;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel: cluster cards ── */
    #cluster-panel {
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 12px;
    }
    #cluster-panel h2 { margin: 0 0 10px; font-size: 0.9rem; color: #1a1a2e; }

    .study-cluster-card {
      border: 1px solid #ddd; border-radius: 6px;
      margin-bottom: 10px; overflow: hidden;
    }
    .study-cluster-header {
      background: #f0f0f8; padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .study-cluster-name { font-weight: bold; font-size: 0.9rem; }
    .study-cluster-desc { font-style: italic; font-size: 0.78rem; color: #666; padding: 4px 10px 0; }
    .study-cluster-items { padding: 4px 10px 8px; display: none; }
    .study-cluster-items.open { display: block; }
    .study-cluster-items ul { margin: 4px 0; padding: 0 0 0 14px; }
    .study-cluster-items li { font-size: 0.78rem; margin: 2px 0; }
    .study-item {
      cursor: pointer; padding: 1px 3px; border-radius: 3px;
      display: inline-block; max-width: 240px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .study-item:hover { background: #e0e8ff; }

    /* ── Center panel: UMAP mini-plots ── */
    #umap-panel {
      padding: 12px; overflow-y: auto;
      background: #fafafa;
    }
    #umap-panel h2 { margin: 0 0 10px; font-size: 0.9rem; color: #1a1a2e; }
    #mini-plots-container {
      display: flex; flex-wrap: wrap; gap: 12px;
    }
    .mini-plot-wrapper {
      display: flex; flex-direction: column; align-items: center;
    }
    .mini-plot-label {
      font-size: 0.75rem; font-weight: bold; color: #333;
      margin-bottom: 4px; max-width: 200px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-plot-canvas {
      border: 1px solid #ccc; border-radius: 4px; background: #fff;
      cursor: crosshair;
    }

    /* ── Right panel: feedback ── */
    #feedback-panel {
      background: #fff; border-left: 1px solid #ddd;
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto;
    }
    #feedback-panel h2 { margin: 0; font-size: 0.9rem; color: #1a1a2e; }

    #study-feedback {
      width: 100%; padding: 8px; border: 1px solid #ccc;
      border-radius: 4px; font-size: 0.85rem; resize: vertical;
      font-family: inherit;
    }
    #study-feedback:disabled { background: #f5f5f5; color: #999; }

    #send-feedback {
      padding: 8px 16px; background: #1a1a2e; color: #fff;
      border: none; border-radius: 4px; font-size: 0.85rem;
      cursor: pointer; align-self: flex-start;
    }
    #send-feedback:disabled { background: #aaa; cursor: not-allowed; }
    #send-feedback:hover:not(:disabled) { background: #2a2a4e; }

    #study-status {
      font-size: 0.78rem; color: #888; min-height: 16px;
    }

    /* ── Satisfaction banner ── */
    #satisfaction-banner {
      display: none;
      background: #fffbe6; border: 1px solid #f0c040;
      border-radius: 6px; padding: 10px; font-size: 0.85rem;
    }
    #satisfaction-banner.visible { display: block; }
    #satisfaction-banner p { margin: 0 0 8px; }
    #satisfaction-banner .banner-actions { display: flex; gap: 8px; }
    #satisfaction-yes {
      padding: 5px 12px; background: #3cb44b; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 0.82rem;
    }
    #satisfaction-no {
      padding: 5px 12px; background: #e55; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 0.82rem;
    }

    /* ── Session complete banner ── */
    #session-complete-banner {
      display: none;
      background: #e6f4ea; border: 1px solid #3cb44b;
      border-radius: 6px; padding: 12px; font-size: 0.9rem; text-align: center;
    }
    #session-complete-banner.visible { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Conversational Clustering Study</h1>
    <span id="session-display">Session: {{ session_id }}</span>
  </header>

  <div class="study-layout">

    <!-- Left: cluster cards -->
    <section id="cluster-panel">
      <h2>Clusters</h2>
      <div id="cluster-cards-container">
        <p style="color:#999;font-size:0.82rem;">Loading clusters...</p>
      </div>
    </section>

    <!-- Center: UMAP mini-plots -->
    <section id="umap-panel">
      <h2>Embedding Projection (per cluster)</h2>
      <div id="mini-plots-container">
        <p style="color:#999;font-size:0.82rem;">Projection loading...</p>
      </div>
    </section>

    <!-- Right: feedback input -->
    <aside id="feedback-panel">
      <h2>Your Feedback</h2>

      <!-- Satisfaction confirmation banner -->
      <div id="satisfaction-banner">
        <p id="satisfaction-message"></p>
        <div class="banner-actions">
          <button id="satisfaction-yes">Yes, end session</button>
          <button id="satisfaction-no">No, continue</button>
        </div>
      </div>

      <!-- Session complete banner -->
      <div id="session-complete-banner">
        Session complete. Thank you!
      </div>

      <textarea
        id="study-feedback"
        rows="4"
        placeholder="Type your feedback here..."
        disabled
      ></textarea>
      <button id="send-feedback" disabled>Send</button>
      <div id="study-status">Waiting for session to initialize...</div>
    </aside>

  </div>

  <script
    src="https://cdn.socket.io/4.6.2/socket.io.min.js"
    integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQbl"
    crossorigin="anonymous"
  ></script>
  <script src="/static/study.js"></script>
</body>
</html>
