<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch LLM Oracle — Conversational Clustering</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0; padding: 0;
      background: #f5f5f5; color: #222;
      height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #1a1a2e; color: #eee;
      padding: 10px 20px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    #session-display { font-size: 0.8rem; opacity: 0.75; }
    #watch-mode-badge {
      font-size: 0.7rem;
      background: #3cb44b; color: #fff;
      padding: 2px 8px; border-radius: 4px; font-weight: bold;
    }

    .study-layout {
      display: grid;
      grid-template-columns: 300px 1fr 340px;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    #cluster-panel {
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 12px;
    }
    #cluster-panel h2 { margin: 0 0 10px; font-size: 0.9rem; color: #1a1a2e; }

    .study-cluster-card {
      border: 1px solid #ddd; border-radius: 6px;
      margin-bottom: 10px; overflow: hidden;
    }
    .study-cluster-header {
      background: #f0f0f8; padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .study-cluster-name { font-weight: bold; font-size: 0.9rem; }
    .study-cluster-desc { font-style: italic; font-size: 0.78rem; color: #666; padding: 4px 10px 0; }
    .study-cluster-items { padding: 4px 10px 8px; display: none; }
    .study-cluster-items.open { display: block; }
    .study-cluster-items ul { margin: 4px 0; padding: 0 0 0 14px; }
    .study-cluster-items li { font-size: 0.78rem; margin: 2px 0; }
    .study-item {
      cursor: pointer; padding: 1px 3px; border-radius: 3px;
      display: inline-block; max-width: 240px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .study-item:hover { background: #e0e8ff; }

    #umap-panel {
      padding: 12px; overflow-y: auto;
      background: #fafafa;
    }
    #umap-panel h2 { margin: 0 0 10px; font-size: 0.9rem; color: #1a1a2e; }
    #mini-plots-container { display: flex; flex-wrap: wrap; gap: 12px; }
    .mini-plot-wrapper { display: flex; flex-direction: column; align-items: center; }
    .mini-plot-label {
      font-size: 0.75rem; font-weight: bold; color: #333;
      margin-bottom: 4px; max-width: 200px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-plot-canvas { border: 1px solid #ccc; border-radius: 4px; background: #fff; }

    /* Right panel: chat log */
    #chat-panel {
      background: #fff;
      border-left: 1px solid #ddd;
      display: flex; flex-direction: column;
      padding: 12px; gap: 8px;
      overflow: hidden;
    }
    #chat-panel h2 { margin: 0; font-size: 0.9rem; color: #1a1a2e; }
    #chat-status { font-size: 0.75rem; color: #888; min-height: 14px; }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 8px;
      background: #fafafa;
      display: flex; flex-direction: column; gap: 8px;
    }
    .bubble {
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      line-height: 1.35;
      max-width: 92%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .bubble-agent {
      background: #e7eefb;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .bubble-oracle {
      background: #fff3d6;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .bubble-meta {
      font-size: 0.65rem; color: #888;
      margin-bottom: 2px;
      letter-spacing: 0.02em;
    }
    .bubble.satisfied {
      border: 1px solid #3cb44b;
      background: #e6f4ea;
    }
    #session-complete-banner {
      display: none;
      background: #e6f4ea; border: 1px solid #3cb44b;
      border-radius: 6px; padding: 10px; font-size: 0.85rem; text-align: center;
    }
    #session-complete-banner.visible { display: block; }
  </style>
</head>
<body data-mode="watch">
  <header>
    <h1>Watch LLM Oracle</h1>
    <span id="watch-mode-badge">WATCH</span>
    <span id="session-display">Session: {{ session_id }}</span>
  </header>

  <div class="study-layout">
    <section id="cluster-panel">
      <h2>Clusters</h2>
      <div id="cluster-cards-container">
        <p style="color:#999;font-size:0.82rem;">Loading clusters...</p>
      </div>
    </section>

    <section id="umap-panel">
      <h2>Embedding Projection (per cluster)</h2>
      <div id="mini-plots-container">
        <p style="color:#999;font-size:0.82rem;">Projection loading...</p>
      </div>
    </section>

    <aside id="chat-panel">
      <h2>Conversation</h2>
      <div id="chat-status">Waiting for agent to begin...</div>
      <div id="chat-log"></div>
      <div id="session-complete-banner">Session complete.</div>
    </aside>
  </div>

  <script src="/static/socket.io.min.js"></script>
  <script src="/static/study.js?v=2026-05-18-6"></script>
</body>
</html>
