[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
markers = [
    "llm: integration tests requiring a real LLM client (skipped when ANTHROPIC_API_KEY is unset)",
    "slow: tests that are slow due to embedding computation or other expensive operations",
]
